<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161B"/>
      <stop offset="50%" stop-color="#0E1014"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#EA4B12"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D3A0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D3A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D2128"/>
      <stop offset="100%" stop-color="#12151B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  <rect width="800" height="900" fill="url(#grid)"/>

  <!-- Radial highlight -->
  <circle cx="400" cy="360" r="300" fill="url(#glowGrad)"/>
  <circle cx="400" cy="320" r="180" fill="#FF5A1F" opacity="0.08" filter="blur(40px)"/>

  <!-- Tech Geometric Circuits -->
  <g stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.5" fill="none">
    <circle cx="400" cy="340" r="190" stroke-dasharray="6 6"/>
    <circle cx="400" cy="340" r="220" opacity="0.4"/>
    <line x1="100" y1="340" x2="200" y2="340"/>
    <line x1="600" y1="340" x2="700" y2="340"/>
    <circle cx="200" cy="340" r="4" fill="#FF5A1F"/>
    <circle cx="600" cy="340" r="4" fill="#34D3A0"/>
    <line x1="400" y1="80" x2="400" y2="140"/>
    <circle cx="400" cy="140" r="4" fill="#FF5A1F"/>
  </g>

  <!-- Avatar Silhouette / Modern Professional Developer Figure -->
  <g transform="translate(0, 20)">
    <!-- Base card -->
    <rect x="250" y="190" width="300" height="300" rx="150" fill="url(#cardGrad)" stroke="#2C313B" stroke-width="2"/>
    
    <!-- Monogram YD -->
    <text x="400" y="365" font-family="'Geist', 'Instrument Serif', sans-serif" font-size="108" font-weight="700" fill="#F1EFEA" text-anchor="middle" letter-spacing="-4">YD</text>

    <!-- Badge -->
    <rect x="310" y="440" width="180" height="36" rx="18" fill="#14181F" stroke="#FF5A1F" stroke-width="1.5"/>
    <circle cx="328" cy="458" r="5" fill="#34D3A0"/>
    <text x="408" y="464" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#E2E4E8" text-anchor="middle" letter-spacing="1">SPRING BOOT · AWS</text>
  </g>

  <!-- Info Box at Bottom -->
  <g transform="translate(100, 600)">
    <rect x="0" y="0" width="600" height="210" rx="16" fill="#111317" stroke="#242830" stroke-width="1"/>
    
    <text x="300" y="48" font-family="'Geist', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Yadnyesh Dhangar</text>
    <text x="300" y="80" font-family="'Geist Mono', monospace" font-size="14" fill="#FF7C4A" text-anchor="middle" letter-spacing="0.5">Senior Java Full Stack Developer · Pentagram</text>
    <text x="300" y="112" font-family="'Geist', sans-serif" font-size="14" fill="#8E95A2" text-anchor="middle">Barclays BCPS · T2eorem Trading · DaVita FALCON</text>
    
    <!-- Placeholder hint -->
    <rect x="150" y="138" width="300" height="38" rx="8" fill="#1A1E26" stroke="#363C48" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="300" y="162" font-family="'Geist Mono', monospace" font-size="12" fill="#9DA5B4" text-anchor="middle">📷 Photo Placeholder (Drop photo here)</text>
  </g>
</svg>
